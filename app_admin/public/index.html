<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Administrateur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style_main.css">
</head>

<body>


    <div id="app">

        <nav>
            <div style="display: flex; align-items: center; gap: 40px;">
                <div class="logo espace-letter uppercase">
                    <a class="remove-blue-link" href="index.html">Espace Admin</a>
                </div>
                <div class="flex" style="gap: 20px;">
                    <a href="index.html" class="nav-info uppercase espace-letter remove-blue-link" style="color: var(--black); border-bottom: 2px solid var(--black);">Scénarios</a>
                    <a href="lib/html/assign_pnj.html" class="nav-info uppercase espace-letter remove-blue-link">PNJ & Assignation</a>
                    <a href="lib/html/download.html" class="nav-info uppercase espace-letter remove-blue-link">Builds</a>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="nav-info uppercase espace-letter" id="nb-chap"></div>
                <button class="nav-info uppercase" 
                        style="background: none; border: none; cursor: pointer; color: var(--swiss-red); font-weight: 900;" 
                        onclick="localStorage.removeItem('admin_session'); window.location.href='login.html';">
                    Quitter
                </button>
            </div>
        </nav>


        <main id="dashboard" class="container">

            <div class="page-header">
                <h2 class="page-title uppercase">Scénarios</h2>
                <div class="nav-info uppercase espace-letter" id="nb-chap"></div>
            </div>

            <div class="grid-scenarios">
            </div>
        </main>

    </div>

    <div id="custom-modal" class="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-title" id="modal-title">TITRE</div>
            <div class="confirm-message" id="modal-message">Message ici...</div>
            
            <div class="input-group hidden" id="modal-input-container">
                <input type="text" id="modal-input-field" placeholder="Saisir ici...">
            </div>

            <div class="confirm-actions">
                <button class="btn btn-outline press-effect" id="modal-cancel">Annuler</button>
                <button class="btn btn-black press-effect" id="modal-ok">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/manage_scenario.js" defer></script>

</body>

</html>
