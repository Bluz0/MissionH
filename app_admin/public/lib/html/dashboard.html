<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau De Bord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style/style_main.css">
</head>

<body>
    <main id="scenario-view" class="container animate-page">
        
        <div class="page-header" style="align-items: flex-start; flex-direction: column;">
            
            <button class="btn btn-black press-effect"
                style="border:none; margin-bottom: 1rem;padding-left: 2.5em;" id="button-back"> < Retour</button>
            <div style="display:flex; justify-content: space-between; width:100%; align-items: flex-end;">
                <h2 id="current-scenario-title" class="page-title rapprochement-letter"></h2>
                <button class="btn btn-black press-effect" id="new-d">+ Nouveau dialogue</button>
            </div>
        </div>
        <table class="dialogue-table">
            <thead>
                <tr class="uppercase">
                    <th>ID</th>
                    <th>Locuteur</th>
                    <th>Contenu du message</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody class="dialogue-list-body">
            </tbody>
        </table>
    </main>
    <div class="add-dialogue" hidden>

    </div>

    <div class="delete-dialogue" hidden>
        
    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../scripts/list_dialogue_scen.js" defer></script>
</body>

</html>
